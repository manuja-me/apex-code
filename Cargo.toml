[package]
name = "apex-code"
version = "0.1.0"
edition = "2021"
description = "High-performance autonomous coding agent CLI and Swiss-style TUI with OmniRoute gateway, multi-provider routing, and tree-sitter intelligence"
authors = ["manuja-me"]
license = "MIT"

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ignore = "0.4"
regex = "1.11"
dirs = "5.0"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"
chrono = "0.4"
